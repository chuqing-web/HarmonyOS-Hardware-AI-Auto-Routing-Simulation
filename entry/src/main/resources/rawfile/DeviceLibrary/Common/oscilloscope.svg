<svg width="80" height="60" viewBox="-40 -30 80 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Oscilloscope - screen + inputs -->
  <rect x="-35" y="-25" width="45" height="30" rx="2" fill="none" stroke="#000" stroke-width="1.2"/>
  <rect x="-30" y="-20" width="35" height="20" fill="none" stroke="#666" stroke-width="0.4"/>
  <!-- Grid lines -->
  <line x1="-30" y1="-14" x2="5" y2="-14" stroke="#bbb" stroke-width="0.2"/>
  <line x1="-30" y1="-8" x2="5" y2="-8" stroke="#bbb" stroke-width="0.2"/>
  <line x1="-30" y1="-2" x2="5" y2="-2" stroke="#bbb" stroke-width="0.2"/>
  <line x1="-20" y1="-20" x2="-20" y2="0" stroke="#bbb" stroke-width="0.2"/>
  <line x1="-10" y1="-20" x2="-10" y2="0" stroke="#bbb" stroke-width="0.2"/>
  <line x1="0" y1="-20" x2="0" y2="0" stroke="#bbb" stroke-width="0.2"/>
  <!-- Waveform preview -->
  <polyline points="-28,-10 -18,-18 -8,-4 2,-10" fill="none" stroke="#00f" stroke-width="1"/>
  <!-- CH1-4 inputs on left -->
  <line x1="-45" y1="-15" x2="-35" y2="-15" stroke="#000" stroke-width="1"/>
  <line x1="-45" y1="-5" x2="-35" y2="-5" stroke="#000" stroke-width="1"/>
  <line x1="-45" y1="5" x2="-35" y2="5" stroke="#000" stroke-width="1"/>
  <line x1="-45" y1="15" x2="-35" y2="15" stroke="#000" stroke-width="1"/>
  <circle cx="-45" cy="-15" r="1.5" fill="#000"/>
  <circle cx="-45" cy="-5" r="1.5" fill="#000"/>
  <circle cx="-45" cy="5" r="1.5" fill="#000"/>
  <circle cx="-45" cy="15" r="1.5" fill="#000"/>
  <text x="0" y="32" font-size="5" fill="#000" text-anchor="middle">REF</text>
</svg>
