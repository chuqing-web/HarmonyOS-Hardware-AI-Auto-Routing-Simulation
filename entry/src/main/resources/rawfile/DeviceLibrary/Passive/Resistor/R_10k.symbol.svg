<svg width="120" height="30" viewBox="-60 -15 120 30" xmlns="http://www.w3.org/2000/svg">
  <!-- US-style zigzag resistor -->
  <polyline points="-48,0 -40,0 -36,-8 -28,8 -20,-8 -12,8 -4,-8 4,8 12,-8 20,8 24,0 48,0"
            fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Lead lines to pin dots -->
  <line x1="-60" y1="0" x2="-48" y2="0" stroke="#000" stroke-width="1.2"/>
  <line x1="24" y1="0" x2="48" y2="0" stroke="#000" stroke-width="1.2"/>
  <line x1="-48" y1="0" x2="48" y2="0" stroke="none"/>
  <!-- Pin dots -->
  <circle cx="-60" cy="0" r="2" fill="#000"/>
  <circle cx="48" cy="0" r="2" fill="#000"/>
  <!-- Labels -->
  <text x="0" y="-12" font-size="6" fill="#000" text-anchor="middle" font-family="sans-serif">REF</text>
  <text x="0" y="18" font-size="5" fill="#444" text-anchor="middle" font-family="sans-serif">VALUE</text>
</svg>
