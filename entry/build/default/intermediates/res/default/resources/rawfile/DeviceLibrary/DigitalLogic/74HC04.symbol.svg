<svg width="120" height="80" viewBox="-60 -40 120 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Inverter triangle -->
  <polygon points="-20,-25 10,0 -20,25" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Output bubble -->
  <circle cx="14" cy="0" r="4" fill="none" stroke="#000" stroke-width="1.2"/>
  <!-- Pin: input A -->
  <line x1="-60" y1="-20" x2="-20" y2="-20" stroke="#000" stroke-width="1.2"/>
  <!-- Pin: output Y -->
  <line x1="18" y1="-20" x2="60" y2="-20" stroke="#000" stroke-width="1.2"/>
  <!-- Pins: VCC top / GND bottom -->
  <line x1="0" y1="-40" x2="0" y2="-25" stroke="#000" stroke-width="1.2"/>
  <line x1="0" y1="25" x2="0" y2="40" stroke="#000" stroke-width="1.2"/>
  <!-- Pin dots -->
  <circle cx="-60" cy="-20" r="2" fill="#000"/>
  <circle cx="60" cy="-20" r="2" fill="#000"/>
  <circle cx="0" cy="-40" r="2" fill="#000"/>
  <circle cx="0" cy="40" r="2" fill="#000"/>
  <!-- Labels -->
  <text x="0" y="-48" font-size="6" fill="#000" text-anchor="middle" font-family="sans-serif">REF</text>
  <text x="0" y="52" font-size="5" fill="#444" text-anchor="middle" font-family="sans-serif">74HC04</text>
</svg>
