<svg width="60" height="50" viewBox="-30 -25 60 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Frequency Counter - rectangular display -->
  <rect x="-25" y="-20" width="50" height="30" rx="2" fill="none" stroke="#000" stroke-width="1.2"/>
  <text x="0" y="-10" font-size="5" fill="#000" text-anchor="middle">f</text>
  <text x="0" y="-2" font-size="9" fill="#000" text-anchor="middle" font-weight="bold">1.00k</text>
  <text x="0" y="5" font-size="5" fill="#666" text-anchor="middle">Hz</text>
  <!-- Input leads -->
  <line x1="-30" y1="-10" x2="-25" y2="-10" stroke="#000" stroke-width="1"/>
  <line x1="-30" y1="10" x2="-25" y2="10" stroke="#000" stroke-width="1"/>
  <circle cx="-25" cy="-10" r="1.5" fill="#f00"/>
  <circle cx="-25" cy="10" r="1.5" fill="#000"/>
  <text x="0" y="32" font-size="5" fill="#000" text-anchor="middle">REF</text>
</svg>
