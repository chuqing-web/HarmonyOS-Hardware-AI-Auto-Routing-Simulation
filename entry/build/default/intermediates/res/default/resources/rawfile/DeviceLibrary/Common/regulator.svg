<svg width="100" height="56" viewBox="-50 -28 100 56" xmlns="http://www.w3.org/2000/svg">
  <!-- Voltage regulator -->
  <rect x="-25" y="-20" width="50" height="40" fill="none" stroke="#000" stroke-width="1.2"/>
  <!-- Input -->
  <line x1="-50" y1="-10" x2="-25" y2="-10" stroke="#000" stroke-width="1.2"/>
  <!-- Output -->
  <line x1="25" y1="-10" x2="50" y2="-10" stroke="#000" stroke-width="1.2"/>
  <!-- Ground -->
  <line x1="0" y1="20" x2="0" y2="28" stroke="#000" stroke-width="1.2"/>
  <line x1="-6" y1="29" x2="6" y2="29" stroke="#000" stroke-width="1"/>
  <line x1="-4" y1="32" x2="4" y2="32" stroke="#000" stroke-width="1"/>
  <line x1="-2" y1="35" x2="2" y2="35" stroke="#000" stroke-width="1"/>
  <!-- Dots -->
  <circle cx="-50" cy="-10" r="2" fill="#000"/>
  <circle cx="50" cy="-10" r="2" fill="#000"/>
  <circle cx="0" cy="28" r="2" fill="#000"/>
  <!-- Label -->
  <text x="0" y="2" font-size="6" fill="#000" text-anchor="middle">REG</text>
  <text x="0" y="-26" font-size="5" fill="#000" text-anchor="middle">REF</text>
</svg>
