<svg width="100" height="90" viewBox="-50 -55 100 90" xmlns="http://www.w3.org/2000/svg">
  <!-- Opamp triangle -->
  <polygon points="-35,-30 35,0 -35,30" fill="none" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="-22" y="-6" font-size="7" fill="#000">+</text>
  <text x="-22" y="12" font-size="7" fill="#000">−</text>
  <!-- Inputs -->
  <line x1="-50" y1="-20" x2="-35" y2="-20" stroke="#000" stroke-width="1.2"/>
  <line x1="-50" y1="20" x2="-35" y2="20" stroke="#000" stroke-width="1.2"/>
  <!-- Output -->
  <line x1="35" y1="0" x2="50" y2="0" stroke="#000" stroke-width="1.2"/>
  <!-- Power pins -->
  <line x1="0" y1="-50" x2="0" y2="-30" stroke="#000" stroke-width="1.2"/>
  <line x1="0" y1="30" x2="0" y2="50" stroke="#000" stroke-width="1.2"/>
  <!-- Dots -->
  <circle cx="-50" cy="-20" r="2" fill="#000"/>
  <circle cx="-50" cy="20" r="2" fill="#000"/>
  <circle cx="50" cy="0" r="2" fill="#000"/>
  <circle cx="0" cy="-50" r="2" fill="#000"/>
  <circle cx="0" cy="50" r="2" fill="#000"/>
  <text x="0" y="-56" font-size="5" fill="#000" text-anchor="middle">REF</text>
</svg>
